services:
  postgres:
    image: postgres:16-alpine
    container_name: mt_workspace_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mt_workspace}
    volumes:
      - mt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mt_workspace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mt_postgres_data:
